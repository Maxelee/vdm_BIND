[TRAINING]
# ==============================================================================
# CleanVDM - COSMO_NORM Configuration
# ==============================================================================
# 
# This config uses cosmological normalization (cosmo_norm):
#   - DM fields divided by Omega_m BEFORE log transform
#   - Baryonic fields divided by Omega_b BEFORE log transform
#   - This removes first-order cosmology dependence for better generalization
#
# Based on clean_vdm_regularized.ini with:
#   1. cosmo_norm = True (NEW)
#   2. Updated normalization stats paths for cosmo_norm
#   3. Updated quantile transformer for cosmo_norm (uniform distribution)
#
# ==============================================================================

seed = 8
dataset = IllustrisTNG
data_root = /mnt/home/mlee1/ceph/train_data_rotated2_128_cpu/train/
field = gas
boxsize = 6.25 

# ==============================================================================
# COSMOLOGICAL NORMALIZATION (NEW)
# ==============================================================================
# Divide fields by cosmological parameters BEFORE log transform:
#   - DM fields: divide by Omega_m (param index 0)
#   - Baryonic fields: divide by Omega_b (param index 6)
# This removes first-order cosmology dependence from the data.

cosmo_norm = True

# ==============================================================================
# TRAINING HYPERPARAMETERS
# ==============================================================================

batch_size = 128
num_workers = 40
cropsize = 128
max_epochs = 250

# ==============================================================================
# LEARNING RATE
# ==============================================================================

learning_rate = 5e-5 
lr_scheduler = cosine_warmup 

# INCREASED WEIGHT DECAY for regularization
weight_decay = 1e-4

# ==============================================================================
# VDM NOISE SCHEDULE
# ==============================================================================

noise_schedule = learned_nn  
gamma_min = -13.3
gamma_max = 13.0

# ==============================================================================
# DATA AUGMENTATION - STRONGER
# ==============================================================================

data_noise = 1e-3, 1e-3, 1e-3
antithetic_time_sampling = True

# ==============================================================================
# ARCHITECTURE - DEEP AND WIDE
# ==============================================================================

n_blocks = 5
embedding_dim = 96
norm_groups = 8
n_attention_heads = 8 
large_scale_channels = 3

# Dropout for regularization
dropout = 0.1

# ==============================================================================
# CROSS-ATTENTION: DISABLED
# ==============================================================================

use_cross_attention = False

# ==============================================================================
# SELF-ATTENTION: ENABLED
# ==============================================================================

add_attention = True

# ==============================================================================
# FEATURE ENGINEERING
# ==============================================================================

use_fourier_features = True
legacy_fourier = False

# ==============================================================================
# LOSS CONFIGURATION - AGGRESSIVE STELLAR FOCUS
# ==============================================================================

lambdas = 1.0, 1.0, 1.0
channel_weights = 1.0, 1.0, 3.0

use_focal_loss = False
focal_gamma = 3.0  

# ==============================================================================
# PARAMETER CONDITIONING
# ==============================================================================

use_param_prediction = True
param_prediction_weight = 0.01
param_norm_path = /mnt/home/mlee1/Sims/IllustrisTNG_extras/L50n512/SB35/SB35_param_minmax.csv

# ==============================================================================
# NORMALIZATION STATS - COSMO_NORM VERSIONS
# ==============================================================================

# Z-score stats computed with cosmo_norm (field/param before log)
dm_stats_path = /mnt/home/mlee1/vdm_BIND/data/cosmo_norm_dark_matter_stats.npz
gas_stats_path = /mnt/home/mlee1/vdm_BIND/data/cosmo_norm_gas_stats.npz
stellar_stats_path = /mnt/home/mlee1/vdm_BIND/data/cosmo_norm_stellar_stats.npz

# Quantile transformer for stellar (uniform distribution)
quantile_path = /mnt/home/mlee1/vdm_BIND/data/cosmo_norm_quantile_normalizer_stellar.pkl
use_quantile_normalization = True

# ==============================================================================
# MONITORING
# ==============================================================================

validation_plot_frequency = 500

enable_early_stopping = True
early_stopping_patience = 20
early_stopping_min_delta = 0.001

enable_fid_monitoring = False
enable_gradient_monitoring = True
gradient_log_frequency = 50

# ==============================================================================
# EMA - DISABLED
# ==============================================================================

enable_ema = False

# ==============================================================================
# TRAINING DATA
# ==============================================================================

limit_train_samples = None
limit_val_samples = None
limit_train_batches = 1.0

# ==============================================================================
# LOGGING
# ==============================================================================

model_name = clean_vdm_cosmo_norm
tb_logs = /mnt/home/mlee1/ceph/tb_logs3
version = 0

# ==============================================================================
# PRECISION - Full 32-bit for stability
# ==============================================================================

precision = 32
compile_model = False
