[TRAINING]
# ==============================================================================
# CleanVDM - Strong FiLM Conditioning Configuration
# ==============================================================================
# 
# This config is based on clean_vdm_gas_and_star.ini with STRONGER FiLM init:
#
#   KEY CHANGE: film_init_std = 0.1 (was 0.01, 10x increase)
#
# Hypothesis: The default std=0.01 keeps γ≈1 (identity), so FiLM barely modulates
# the features based on cosmology. By increasing to 0.1, we allow stronger 
# cosmology-dependent modulation from initialization, which should help the model
# learn stronger conditioning on Ωb, Ωm.
#
# Expected outcome:
#   - FiLM gamma should show ~10% variation (vs ~0.1% with std=0.01)
#   - Model should better preserve cosmology-gas relationship
#   - Reduced bias when testing on CV (different cosmology from training)
#
# All other settings identical to clean_vdm_gas_and_star.ini
# ==============================================================================

seed = 8
dataset = IllustrisTNG
data_root = /mnt/home/mlee1/ceph/train_data_rotated2_128_cpu/train/
field = gas
boxsize = 6.25 

# ==============================================================================
# TRAINING HYPERPARAMETERS
# ==============================================================================

batch_size = 128
num_workers = 40
cropsize = 128
max_epochs = 250

# ==============================================================================
# LEARNING RATE
# ==============================================================================

learning_rate = 5e-5 
lr_scheduler = cosine_warmup 
weight_decay = 1e-4

# ==============================================================================
# VDM NOISE SCHEDULE
# ==============================================================================

noise_schedule = learned_nn  
gamma_min = -13.3
gamma_max = 13.0

# ==============================================================================
# DATA AUGMENTATION
# ==============================================================================

data_noise = 1e-3, 1e-3, 1e-3
antithetic_time_sampling = True

# ==============================================================================
# ARCHITECTURE
# ==============================================================================

n_blocks = 5
embedding_dim = 96
norm_groups = 8
n_attention_heads = 8 
large_scale_channels = 3
dropout = 0.1

# ==============================================================================
# KEY CHANGE: STRONG FiLM INITIALIZATION
# ==============================================================================
# Default: 0.01 → keeps γ≈1, β≈0 (near-identity transform)
# New: 0.1 → allows ~10% modulation from initialization
# This is the main hypothesis being tested!

film_init_std = 0.1

# ==============================================================================
# CROSS-ATTENTION: DISABLED
# ==============================================================================

use_cross_attention = False

# ==============================================================================
# SELF-ATTENTION: ENABLED
# ==============================================================================

add_attention = True

# ==============================================================================
# FEATURE ENGINEERING
# ==============================================================================

use_fourier_features = True
legacy_fourier = False

# ==============================================================================
# LOSS CONFIGURATION
# ==============================================================================

lambdas = 1.0, 1.0, 1.0
channel_weights = 1.0, 1.0, 3.0
use_focal_loss = False
focal_gamma = 3.0  

# ==============================================================================
# PARAMETER CONDITIONING - STRENGTHENED
# ==============================================================================

use_param_prediction = True
param_prediction_weight = 0.1
param_norm_path = /mnt/home/mlee1/Sims/IllustrisTNG_extras/L50n512/SB35/SB35_param_minmax.csv

# ==============================================================================
# BARYON FRACTION LOSS
# ==============================================================================

use_baryon_fraction_loss = True
baryon_fraction_weight = 0.1

# ==============================================================================
# STELLAR NORMALIZATION
# ==============================================================================

quantile_path = /mnt/home/mlee1/vdm_BIND/data/quantile_normalizer_stellar.pkl
use_quantile_normalization = True

# ==============================================================================
# MONITORING
# ==============================================================================

validation_plot_frequency = 500
enable_early_stopping = True
early_stopping_patience = 20
early_stopping_min_delta = 0.001
enable_fid_monitoring = False
enable_gradient_monitoring = True
gradient_log_frequency = 50

# ==============================================================================
# EMA - DISABLED
# ==============================================================================

enable_ema = False

# ==============================================================================
# TRAINING DATA
# ==============================================================================

limit_train_samples = None
limit_val_samples = None
limit_train_batches = 1.0

# ==============================================================================
# LOGGING
# ==============================================================================

model_name = clean_vdm_strong_film
tb_logs = /mnt/home/mlee1/ceph/tb_logs3
version = 0

# ==============================================================================
# PRECISION
# ==============================================================================

precision = 32
compile_model = False
